name: Deploy Website

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (SHA/branch/tag) to deploy; defaults to the triggering ref if omitted"
        required: false
        type: string

permissions:
  contents: read
  id-token: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: '1'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd web
          julia --project=. -e 'using Pkg; Pkg.develop(path=".."); Pkg.instantiate(); Pkg.add("NodeJS"); using NodeJS; run(`$(npm_cmd()) install highlight.js`);'

      - name: Pre-generate advisory pages
        run: |
          cd web
          julia --project=. pre_generate.jl --clean

      - name: Build site
        run: |
          cd web
          julia --project=. -e 'using Franklin; optimize(prerender=true, minify=false)'

      - name: Process HTML links
        uses: shravanngoswamii/html-link-action@2391fcb0ab8af48941bdfe1bf8eb987834f2c047 # v1.1.0
        with:
          site-dir: web/__site
          nofollow: true

      - name: Build search index
        run: npx pagefind --site web/__site

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/__site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

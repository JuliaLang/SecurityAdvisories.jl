name: Search for updates to applicable advisories

on:
  schedule:
    # Run once a day
    - cron: '30 3 */1 * *'
  workflow_dispatch:
    inputs:
      since:
        description: 'Consider advisories updated after this UTC datetime (default: the last successful run)'
        type: string
        default: ''

permissions:
  contents: read
  actions: read

# Only allow one updated-advisories search to run at a time; queue subsequent runs. Each search workflow has
# its own group, so searches from different workflows may overlap against the shared NVD key
concurrency:
  group: search-updated-advisories
  cancel-in-progress: false

jobs:
  search-updated-advisories:
    name: Search targets from packages with advisories updated since the last run
    uses: ./.github/workflows/find-and-search.yml
    with:
      mode: updated-advisories
      since: ${{ inputs.since }}
    secrets: inherit

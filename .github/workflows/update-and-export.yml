name: Update IDs, timestamps, and export OSV

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish:
    if: github.event_name == 'push'
    permissions:
      contents: write

    runs-on: ubuntu-latest

    outputs:
      ref: ${{ steps.publish.outputs.ref }}

    steps: &export-steps
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # A queued run must include merges and assignments made since it was triggered.
        ref: ${{ github.event_name == 'push' && 'refs/heads/main' || github.sha }}
        persist-credentials: false
        fetch-depth: 0

    - uses: ./.github/actions/setup-julia-depot # zizmor: ignore[self-repository]

    - name: Install Julia dependencies
      run: |
        julia --project=. -e 'using Pkg; Pkg.instantiate()'

    - name: Checkout osv-schema
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: JuliaComputing/osv-schema # temporarily use https://github.com/ossf/osv-schema/pull/669
        ref: 6649d8ec2274a1a5f7a58e3725ae1f577d712f82
        path: osv-schema
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: 'stable'
        cache-dependency-path: osv-schema/tools/osv-linter/go.sum

    - name: Build osv-linter
      working-directory: osv-schema/tools/osv-linter
      run: go build -o ../../../osv-linter ./cmd/osv

    - name: Assign ids and timestamps
      id: assign
      env:
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        base=$(git rev-parse HEAD)
        julia --project=. scripts/assign_ids_and_dates.jl
        echo "base=$base" >> "$GITHUB_OUTPUT"
        git add advisories
        git diff -w -U0 --cached
        if [[ "$GITHUB_EVENT_NAME" == push ]] && ! git diff -w --cached --quiet; then
          title=$(sed -n 's/^title=//p' "$GITHUB_OUTPUT")
          git commit -m "$title"
        fi

    - name: Export OSV
      run: |
        julia --project=. scripts/export_osv.jl
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Validate JSON
      run: |
        if ! output=$(./osv-linter record lint osv 2>&1) || [[ -n "$output" ]]; then
          printf '%s\n' "$output"
          exit 1
        fi

    - name: Prepare OSV branch
      id: prepare_osv
      env:
        GIT_AUTHOR_NAME: github-actions[bot]
        GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        GIT_COMMITTER_NAME: github-actions[bot]
        GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
      run: |
        SOURCE=$(git rev-parse HEAD)
        REF=refs/remotes/origin/generated/osv
        export GIT_WORK_TREE="$PWD/osv"
        export GIT_INDEX_FILE="$RUNNER_TEMP/osv.index"
        git read-tree "$REF"
        git add --all --intent-to-add
        git diff -w -U0
        if git diff -w --quiet; then
          echo "No changes to commit."
          COMMIT=$(git rev-parse "$REF")
        else
          git add --all
          TREE=$(git write-tree)
          COMMIT=$(git commit-tree "$TREE" -p "$REF" -m "[automated] export $GITHUB_REF_NAME@($SOURCE)")
        fi
        echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"

    - name: Confirm OSV modified timestamps
      shell: bash
      env:
        OSV_COMMIT: ${{ steps.prepare_osv.outputs.commit }}
      run: |
        while IFS= read -r -d '' json_file; do
          git_path=${json_file#./osv/}
          json_time=$(jq -r '.modified' "$json_file")
          json_epoch=$(date -d "$json_time" +%s)

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Timestamps are finalized when changes land on main, so a dry run
            # can only check that changed content comes with a newer stamp
            old_json=$(git show "origin/generated/osv:$git_path" 2>/dev/null) || continue  # newly published
            jq -S 'del(.modified)' <<<"$old_json" | cmp -s - <(jq -S 'del(.modified)' "$json_file") && continue
            old_epoch=$(date -d "$(jq -r '.modified' <<<"$old_json")" +%s)
            if [[ $json_epoch -le $old_epoch ]]; then
              echo "${json_file}: content changed but modified did not advance (still ${json_time})"
              exit 1
            fi
          else
            git_time=$(git log -1 --first-parent --format="%cd" --date=iso-strict "$OSV_COMMIT" -- "$git_path")
            git_epoch=$(date -d "$git_time" +%s)
            diff_minutes=$(( (json_epoch - git_epoch) / 60 ))
            abs_diff=${diff_minutes#-}

            if [[ $abs_diff -gt 5 ]]; then
              echo "${json_file}: json: ${json_time} -> ${json_epoch}"
              echo "${json_file}:  git: ${git_time} -> ${git_epoch}"
              echo "${json_file}: diff: ${diff_minutes} minutes"
              exit 1
            fi
          fi
        done < <(find ./osv -name "*.json" -type f -print0)

    - name: Publish advisories and OSV atomically
      id: publish
      if: github.event_name == 'push' && github.ref_name == 'main'
      env:
        GH_TOKEN: ${{ github.token }}
        GIT_CONFIG_COUNT: 1
        GIT_CONFIG_KEY_0: credential.https://github.com.helper
        GIT_CONFIG_VALUE_0: '!gh auth git-credential'
        BASE: ${{ steps.assign.outputs.base }}
        OSV_COMMIT: ${{ steps.prepare_osv.outputs.commit }}
      run: bash scripts/publish_advisories.sh "$BASE" "$OSV_COMMIT"

  update-and-export:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps: *export-steps

  deploy-website:
    permissions:
      contents: read
      id-token: write
      pages: write
    needs: publish
    if: needs.publish.outputs.ref != ''
    # The same-commit relative workflow call is supported by actionlint v1.7.12; $/ is not.
    uses: ./.github/workflows/deploy-web.yml # zizmor: ignore[self-repository]
    with:
      ref: ${{ needs.publish.outputs.ref }}

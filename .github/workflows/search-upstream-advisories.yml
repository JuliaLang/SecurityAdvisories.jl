name: Search for upstream advisories

on:
  workflow_dispatch:
    inputs:
      haystack:
        description: 'Advisory ID, package name, list of package names, or upstream project id (like repology.org/project/curl); empty for an ecosystem walk'
        type: string
        default: ''
      filter:
        description: 'Filter results to only those that affect a Julia package or have significant updates'
        type: boolean
        default: true

permissions:
  contents: read

# Only allow one search to run at a time across all the search workflows, which share the
# NVD API key's rate limit; queue subsequent runs
concurrency:
  group: upstream-search
  cancel-in-progress: false

jobs:
  identify-advisories:
    name: ${{ inputs.haystack == '' && 'Ecosystem search' || format('Search {0}', inputs.haystack) }}
    uses: ./.github/workflows/search-and-pr.yml
    with:
      haystack: ${{ inputs.haystack }}
      filter: ${{ inputs.filter }}
    secrets: inherit

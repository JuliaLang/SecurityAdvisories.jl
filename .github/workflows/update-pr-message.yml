name: Update PR message

# Recompute a pull request's title and body from the advisory files changed on its branch.
# This runs on jlsec-bot's fork — where the bot's PR branches live — whenever a branch is
# pushed, so edits to a branch keep its PR message up to date. The fork must define a
# JLSEC_BOT_TOKEN secret that can edit pull requests on JuliaLang/SecurityAdvisories.jl.

on:
  push:
    # The fetch-updates branch's PR carries its own field-change message; leave it alone
    branches-ignore: [main, fetch-updates]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-pr-message-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Look up the PR before the expensive checkout/Julia work so branches without
  # one (e.g. rejection-only branches with no open PR yet) cost seconds
  find-pr:
    # The PR branches only live on the bot's fork
    if: github.repository == 'jlsec-bot/SecurityAdvisories.jl'
    runs-on: ubuntu-latest
    outputs:
      number: ${{ steps.pr.outputs.number }}
    steps:
    - name: Find the open pull request for this branch
      id: pr
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        pr=$(gh pr list --repo JuliaLang/SecurityAdvisories.jl --head "jlsec-bot:${GITHUB_REF_NAME}" --json number --jq '.[0].number')
        [ -z "$pr" ] && echo "No open pull request for ${GITHUB_REF_NAME}; nothing to update"
        echo "number=$pr" >> "$GITHUB_OUTPUT"

  update-message:
    needs: find-pr
    if: needs.find-pr.outputs.number != ''
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Fetch the upstream base
      run: |
        git remote add upstream https://github.com/JuliaLang/SecurityAdvisories.jl
        git fetch upstream main

    - name: Setup Julia
      uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2

    - uses: julia-actions/cache@b7788abd52452d5bc033d69796e110d9906af4ab # v3.2.0

    - name: Install Julia dependencies
      run: |
        julia --project=. -e 'using Pkg; Pkg.instantiate()'

    - name: Recompute the PR message
      id: message
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        julia --project=. scripts/update_pr_message.jl upstream/main...HEAD

    - name: Update the pull request
      # Leave the message alone when the branch no longer changes any advisories
      # (e.g. a rejection-only branch that just edits rejected.toml)
      if: steps.message.outputs.n_changed != '0'
      env:
        GH_TOKEN: ${{ secrets.JLSEC_BOT_TOKEN }}
        TITLE: ${{ steps.message.outputs.title }}
        BODY: ${{ steps.message.outputs.body }}
      run: |
        gh pr edit "${{ needs.find-pr.outputs.number }}" --repo JuliaLang/SecurityAdvisories.jl --title "$TITLE" --body "$BODY"

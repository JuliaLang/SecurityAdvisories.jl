# Upstream advisories that were reviewed and rejected, preventing the automation
# from re-proposing them. Entries are keyed by the advisory's preferred upstream
# id, with optional `aliases`, `packages`, and `reason` fields; a rejection only
# applies to the packages it lists. See CONTRIBUTING.md for details.

[CVE-2010-0207]
aliases = ["GHSA-3274-8h4c-g6q9", "EUVD-2010-0238"]
packages = ["Poppler_jll"]
reason = "This 2010-era xpdf infinite loop was fixed long before any Poppler_jll build existed; NVD only lists an unmappable distribution-style version (0.26.5-2), producing a spurious unbounded match. Reviewed in #353."

[CVE-2018-20217]
packages = ["Kerberos_krb5_jll"]
reason = "Fixed in krb5 1.17, predating the earliest krb5 packaged as Kerberos_krb5_jll (1.19.3). It only matched because NVD folds the '5' of krb5 into its version numbers, preventing a bounded mapping. Reviewed in #354."

[CVE-2018-5709]
packages = ["Kerberos_krb5_jll"]
reason = "Affects krb5 through 1.16, predating the earliest krb5 packaged as Kerberos_krb5_jll (1.19.3). It only matched because NVD folds the '5' of krb5 into its version numbers, preventing a bounded mapping. Reviewed in #354."

[CVE-2018-5710]
packages = ["Kerberos_krb5_jll"]
reason = "Affects krb5 through 1.16, predating the earliest krb5 packaged as Kerberos_krb5_jll (1.19.3). It only matched because NVD folds the '5' of krb5 into its version numbers, preventing a bounded mapping. Reviewed in #354."

[CVE-2021-4048]
packages = ["SLICOT_jll", "ReferenceBLAS32_jll", "ReferenceBLAS_jll"]
reason = "These packages do not build or redistribute the vulnerable `*ARRV` family. Ref https://github.com/JuliaPackaging/Yggdrasil/blob/31d7ae44c2fc697b3d53d08dd6b02c69d46b69bd/S/SLICOT/build_tarballs.jl#L30-L31 and https://github.com/JuliaPackaging/Yggdrasil/blob/fc9bcdfd56ec869e741bc4c7e1866c287bfbfd01/R/ReferenceBLAS/common.jl#L48-52"

[CVE-2023-52353]
packages = ["MbedTLS_jll"]
reason = "Only applies when TLS 1.3 is enabled, per the Debian security team; MbedTLS_jll ships the 2.x series, which does not support TLS 1.3. Reviewed in #202 and #465."

[CVE-2025-25468]
packages = ["FFMPEG_jll", "FFMPEG_nogpl_jll", "FFplay_jll"]
reason = "This memory leak in libavutil/mem.c only existed on FFmpeg's master branch for a few days; no FFmpeg release contains it. Reviewed in #399."

[CVE-2025-25469]
packages = ["FFMPEG_jll", "FFMPEG_nogpl_jll", "FFplay_jll"]
reason = "This memory leak in libavutil/iamf.c only affected FFmpeg's git master before commit d5873be; no FFmpeg release contains it. Reviewed in #399."

[CVE-2026-13595]
packages = ["Libuuid_jll"]
reason = "Libuuid_jll does not build or distribute the vulnerable libblkid library"

# TensorFlow advisories rejected for XLA_Tools_jll, reviewed in #615. XLA_Tools_jll
# builds only the six standalone tools in //tensorflow/compiler/xla/tools from
# TensorFlow v2.2.1 (show_signature, show_literal, convert_computation,
# show_text_literal, dumped_computation_to_text, dumped_computation_to_operation_list).
# Their link closure is XLA core/client/service plus the interpreter backend,
# tensorflow/core:lib (core/lib + core/platform), host stream_executor, protobuf, and
# absl. It contains no TF op kernels, no core/framework objects, no GraphDef/executor/
# grappler machinery, no TFLite, no Python, and no tf2xla bridge, so TensorFlow
# vulnerabilities in those components are not built into the shipped binaries.

[CVE-2020-15265]
aliases = ["GHSA-rrfp-j2mp-hq9c", "EUVD-2020-0211", "PYSEC-2020-138", "PYSEC-2020-295", "PYSEC-2020-330"]
packages = ["XLA_Tools_jll"]
reason = "Affects TF runtime op kernels (tensorflow/core/kernels), which are not linked into the six standalone XLA tools that XLA_Tools_jll builds from TensorFlow 2.2.1 (XLA core plus the interpreter backend only). Reviewed in #615."

[CVE-2020-15266]
aliases = ["GHSA-xwhf-g6j5-j5gc", "EUVD-2020-0212", "PYSEC-2020-139", "PYSEC-2020-296", "PYSEC-2020-331"]
packages = ["XLA_Tools_jll"]
reason = "Affects a TensorFlow op or Python-level API that requires the TF runtime or Python layer, neither of which is part of the six standalone XLA tools that XLA_Tools_jll builds from TensorFlow 2.2.1 (XLA core plus the interpreter backend only). Reviewed in #615."

[CVE-2020-26266]
aliases = ["GHSA-qhxx-j73r-qpm2", "EUVD-2020-0213", "PYSEC-2020-254", "PYSEC-2020-297", "PYSEC-2020-332"]
packages = ["XLA_Tools_jll"]
reason = "Affects Eigen's FixedPoint quantized types; their headers are included via xla/types.h but quantized types are never instantiated in the six standalone XLA tools that XLA_Tools_jll builds from TensorFlow 2.2.1 (XLA core plus the interpreter backend only), as XLA 2.2.1 has no quantized dtypes. Reviewed in #615."

